# Builds the desktop application for Windows, macOS and Linux on GitHub's free
# hosted runners. Every push to the main/feature branches produces downloadable
# artifacts; pushing a tag like v0.1.0 also attaches them to a GitHub Release.
name: Desktop builds

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v0.1.0) from the selected branch; leave empty to only build"
        required: false
        default: ""

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: MarineDocIntelligence-windows
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: MarineDocIntelligence-macos-arm64
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: MarineDocIntelligence-macos-x64
          - os: ubuntu-22.04
            label: Linux
            artifact: MarineDocIntelligence-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt

      - name: Install Linux GUI libraries (pywebview GTK backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libcairo2-dev pkg-config \
            tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0
          pip install "pygobject<3.51" pycairo

      - name: Install Tesseract (Windows, bundled into the app)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          Add-Content -Path $env:GITHUB_PATH -Value $src   # later steps (tests) need tesseract on PATH
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\tesseract-bundle" | Out-Null
          Copy-Item "$src\*" "$env:GITHUB_WORKSPACE\tesseract-bundle" -Recurse

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Python dependencies
        run: pip install -r desktop/requirements.txt -r backend/requirements-dev.txt

      - name: Backend tests
        run: python -m pytest -q
        working-directory: backend

      - name: Build application
        run: python desktop/build.py

      - name: Bundle Tesseract next to the executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "$env:GITHUB_WORKSPACE\tesseract-bundle" "dist\MarineDocIntelligence\tesseract" -Recurse

      # Launch the frozen app exactly as a user would (minus the window) and wait
      # for its API. Catches launch-time regressions the unit tests cannot see.
      - name: Smoke-test the built app (Windows)
        if: runner.os == 'Windows'
        run: python desktop/smoke.py dist/MarineDocIntelligence/MarineDocIntelligence.exe

      - name: Smoke-test the built app (macOS)
        if: runner.os == 'macOS'
        run: python desktop/smoke.py "dist/Marine Electrical Document Intelligence.app/Contents/MacOS/Marine Electrical Document Intelligence"

      - name: Smoke-test the built app (Linux)
        if: runner.os == 'Linux'
        run: python desktop/smoke.py dist/MarineDocIntelligence/MarineDocIntelligence

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $version = python desktop/version.py
          # Bundled so the installer can add the WebView2 runtime on a machine without it.
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile desktop\windows\MicrosoftEdgeWebview2Setup.exe
          & $iscc "/DAppVersion=$version" desktop\windows\installer.iss
          Move-Item dist\MarineDocIntelligence-Setup.exe "${{ matrix.artifact }}-Setup.exe"

      # The marker goes in after the installer is built, so only the archive
      # carries it: a portable copy keeps its data beside the executable, an
      # installed one uses the per-user folder.
      - name: Package (Windows, portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path dist\MarineDocIntelligence\portable.txt -Value "Data and logs for this copy live in the data folder next to this file."
          Compress-Archive -Path dist\MarineDocIntelligence -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Marine Electrical Document Intelligence.app" "../${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Data and logs for this copy live in the data folder next to this file." > dist/MarineDocIntelligence/portable.txt
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" MarineDocIntelligence

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}-Setup.exe
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    # Runs for a pushed v* tag, or for a manual run that names a tag (the tag is
    # then created on the selected branch's commit when the release is published).
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
